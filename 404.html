<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — Mojo Poker Club</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #0d0f12;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .container {
      max-width: 480px;
    }

    .code {
      font-size: clamp(5rem, 20vw, 10rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, #2ecc71, #d4af37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .divider {
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, #2ecc71, #d4af37);
      border: none;
      margin: 1.5rem auto;
      border-radius: 2px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }

    .hint {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .home-link {
      display: inline-block;
      padding: 0.75rem 2rem;
      border: 2px solid #2ecc71;
      color: #2ecc71;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: background 0.2s, color 0.2s;
    }

    .home-link:hover {
      background: #2ecc71;
      color: #0d0f12;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <hr class="divider" />
    <h1>Page Not Found</h1>
    <p class="hint">
      La page n'existe pas &middot; Seite nicht gefunden &middot; Sayfa bulunamad&#305;
    </p>
    <a href="https://mojopokerclub.com/" class="home-link">Back to Home</a>
  </div>
</body>
</html>
