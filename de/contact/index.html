<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Kontakte — MOJO Poker Club</title>
  <meta name="description" content="Contact MOJO Poker Club support via live chat or Telegram.">
  <link rel="canonical" href="https://mojopokerclub.com/de/contact/">
  <meta property="og:title" content="Kontakte — MOJO Poker Club">
  <meta property="og:description" content="Contact MOJO Poker Club support via live chat or Telegram.">
  <meta property="og:url" content="https://mojopokerclub.com/de/contact/">
  <meta property="og:image" content="https://mojopokerclub.com/opengraph.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Space Grotesk',system-ui,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column}
    a{color:inherit;text-decoration:none}

    .header{position:sticky;top:0;z-index:100;background:rgba(10,10,10,0.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.06);padding:0 24px;height:56px;display:flex;align-items:center}
    .header-inner{max-width:1280px;width:100%;margin:0 auto;display:flex;align-items:center;gap:16px}
    .logo{height:28px}
    .breadcrumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,0.4)}
    .breadcrumbs a:hover{color:rgba(255,255,255,0.7)}
    .breadcrumbs .sep{font-size:10px}

    .hero{padding:48px 24px 0;text-align:center}
    .hero-label{font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:12px}
    .hero-title{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-0.025em;margin-bottom:8px}
    .hero-sub{font-size:15px;color:rgba(255,255,255,0.45)}

    main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px 72px}
    @media(min-width:640px){main{padding:80px 24px 100px}}

    .cards{width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px}

    .card{display:flex;align-items:center;gap:18px;background:#1a1a1a;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:20px 22px;cursor:pointer;text-align:left;width:100%;transition:background 0.15s,border-color 0.15s;text-decoration:none;color:#fff;font-family:inherit;font-size:inherit}
    @media(min-width:640px){.card{padding:24px 28px}}
    .card:hover{background:#2a2a2a;border-color:rgba(255,255,255,0.15)}

    .icon-circle{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .icon-circle.chat{background:#3b82f6}
    .icon-circle.tg{background:#229ED9}
    .icon-circle svg{width:24px;height:24px;fill:#fff}

    .card-title{font-weight:700;font-size:16px;margin-bottom:4px}
    @media(min-width:640px){.card-title{font-size:18px}}
    .card-desc{color:rgba(255,255,255,0.5);font-size:14px}

    .divider{text-align:center;color:rgba(255,255,255,0.3);font-size:13px;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;margin:4px 0}

    .footer{border-top:1px solid rgba(255,255,255,0.06);padding:24px;text-align:center;font-size:12px;color:rgba(255,255,255,0.25)}
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/de/"><img src="/images/mojo-logo.svg" alt="MOJO" class="logo"></a>
      <nav class="breadcrumbs">
        <a href="/de/">Startseite</a>
        <span class="sep">/</span>
        <span style="color:rgba(255,255,255,0.7)">Kontakte</span>
      </nav>
    </div>
  </header>

  <div class="hero">
    <div class="hero-label">/// Kontakte</div>
    <h1 class="hero-title">Kontakte</h1>
    <p class="hero-sub">Wählen Sie, wie Sie uns erreichen möchten</p>
  </div>

  <main>
    <div class="cards">
      <button class="card" onclick="if(window.NormisChat)NormisChat.open();">
        <div class="icon-circle chat">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z"/></svg>
        </div>
        <div>
          <div class="card-title">Live-Chat</div>
          <div class="card-desc">Chatten Sie direkt hier auf der Seite mit uns</div>
        </div>
      </button>

      <div class="divider">oder</div>

      <a class="card" href="https://t.me/mojoagentbot" target="_blank" rel="noopener noreferrer">
        <div class="icon-circle tg">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
        </div>
        <div>
          <div class="card-title">Telegram</div>
          <div class="card-desc">Schreiben Sie unserem Manager direkt in Telegram</div>
        </div>
      </a>
    </div>
  </main>

  <footer class="footer">&copy; 2025 MOJO Poker Club</footer>

  <script src="https://normischat.com/widget.js"></script>
  <script>NormisChat.init({siteId:"agent-fishdanceplo-3383-3619",title:"Mojo Support",subtitle:"Отвечаем быстро"});</script>
</body>
</html>
